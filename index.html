<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #3b82f6
    );
    overflow:hidden;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
}

.background::before,
.background::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
}

.background::before{
    width:350px;
    height:350px;
    background:#60a5fa;
    top:-100px;
    left:-100px;
}

.background::after{
    width:300px;
    height:300px;
    background:#8b5cf6;
    bottom:-100px;
    right:-100px;
}

.card{
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
    padding:60px 50px;
    border-radius:24px;
    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
    max-width:650px;
    width:90%;
}

.logo{
    font-size:18px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#cbd5e1;
    margin-bottom:20px;
}

h1{
    font-size:64px;
    font-weight:800;
    margin-bottom:15px;
}

.highlight{
    color:#93c5fd;
}

.subtitle{
    font-size:18px;
    color:#dbeafe;
    line-height:1.8;
    margin-bottom:35px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-bottom:35px;
}

.time-box{
    min-width:90px;
    padding:15px;
    border-radius:15px;
    background:rgba(255,255,255,0.1);
}

.time-box span{
    display:block;
}

.number{
    font-size:32px;
    font-weight:700;
}

.label{
    font-size:13px;
    color:#cbd5e1;
    margin-top:5px;
}

.socials{
    display:flex;
    justify-content:center;
    gap:15px;
}

.socials a{
    text-decoration:none;
    color:white;
    padding:12px 20px;
    border-radius:999px;
    border:1px solid rgba(255,255,255,0.2);
    transition:0.3s;
}

.socials a:hover{
    background:white;
    color:#0f172a;
}

.footer{
    margin-top:35px;
    font-size:14px;
    color:#cbd5e1;
}

@media(max-width:768px){

    h1{
        font-size:42px;
    }

    .countdown{
        flex-wrap:wrap;
    }

    .time-box{
        min-width:70px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<div class="card">

    <div class="logo">
        Gctfight
    </div>

    <h1>
        Coming <span class="highlight">Soon</span>
    </h1>

<p class="subtitle">
    Coming Soon...<br>
    A student at HIT passionate about Multi-Modal AI, AI Agents, and Embodied AI.
</p>

    <div class="countdown">
        <div class="time-box">
            <span class="number">30</span>
            <span class="label">Days</span>
        </div>

        <div class="time-box">
            <span class="number">12</span>
            <span class="label">Hours</span>
        </div>

        <div class="time-box">
            <span class="number">45</span>
            <span class="label">Minutes</span>
        </div>

        <div class="time-box">
            <span class="number">08</span>
            <span class="label">Seconds</span>
        </div>
    </div>

    <div class="socials">
        <a href="#">GitHub</a>
        <a href="#">Blog</a>
        <a href="#">Email</a>
    </div>

    <div class="footer">
        © 2026 Gctfight. All Rights Reserved.
    </div>

</div>

</body>
</html>
